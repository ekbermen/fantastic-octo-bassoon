          cat > app/src/main/java/com/novax/app/Receivers.kt <<'EOF'
          package com.novax.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.RemoteInput
          import androidx.core.content.ContextCompat

          class CommandReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  Engine.init(context)
                  val text = RemoteInput.getResultsFromIntent(intent)
                      ?.getCharSequence("cmd")?.toString()?.trim().orEmpty()
                  if (text.isNotEmpty()) Engine.runBackground(text)
                  // Bildirimdeki donen gostergeyi temizlemek icin bildirimi yenile
                  try {
                      ContextCompat.startForegroundService(context, Intent(context, NovaxService::class.java))
                  } catch (e: Exception) {
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val a = intent.action
                  if (a == Intent.ACTION_BOOT_COMPLETED || a == "android.intent.action.QUICKBOOT_POWERON") {
                      Engine.init(context)
                      if (Engine.p("svc_on", "0") == "1") {
                          try {
                              ContextCompat.startForegroundService(context, Intent(context, NovaxService::class.java))
                          } catch (e: Exception) {
                          }
                      }
                  }
              }
          }
