          cat > app/src/main/java/com/novax/app/NovaxService.kt <<'EOF'
          package com.novax.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.RemoteInput
          import androidx.core.app.ServiceCompat

          class NovaxService : Service() {

              companion object {
                  const val CHANNEL_ID = "novax_service"
                  const val NOTIF_ID = 1
                  const val ACTION_STOP = "com.novax.app.STOP"

                  @Volatile
                  var running = false
              }

              private var wakeLock: PowerManager.WakeLock? = null

              override fun onCreate() {
                  super.onCreate()
                  Engine.init(this)
                  val channel = NotificationChannel(
                      CHANNEL_ID, "Novax arka plan", NotificationManager.IMPORTANCE_LOW
                  )
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      Engine.prefs().edit().putString("svc_on", "0").apply()
                      running = false
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          ServiceCompat.startForeground(
                              this, NOTIF_ID, buildNotification(),
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                          )
                      } else {
                          startForeground(NOTIF_ID, buildNotification())
                      }
                  } catch (e: Exception) {
                      // Izin yoksa veya arka plandan baslatildiysa Android reddeder
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (wakeLock == null) {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "novax:service").apply {
                          acquire()
                      }
                  }

                  Engine.prefs().edit().putString("svc_on", "1").apply()
                  running = true
                  return START_STICKY
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      this, 1,
                      Intent(this, NovaxService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  // Bildirimden dogrudan komut yazma (uygulamayi acmadan)
                  val ri = RemoteInput.Builder("cmd").setLabel("Novax'a komut yaz").build()
                  val cmdPi = PendingIntent.getBroadcast(
                      this, 2, Intent(this, CommandReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                  )
                  val cmd = NotificationCompat.Action.Builder(android.R.drawable.ic_menu_send, "Komut yaz", cmdPi)
                      .addRemoteInput(ri)
                      .build()
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Novax çalışıyor")
                      .setContentText("Arka planda aktif. Buradan komut yazabilirsin.")
                      .setContentIntent(open)
                      .addAction(cmd)
                      .addAction(0, "Durdur", stop)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              override fun onDestroy() {
                  running = false
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wakeLock = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
