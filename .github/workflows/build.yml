              lateinit var app: Context
              @Volatile private var inited = false

              @Volatile var sink: ((String) -> Unit)? = null
              @Volatile var uiVisible = false
              private val queue = ConcurrentLinkedQueue<String>()
              val tasks = ConcurrentHashMap<Int, Task>()
              val uiLock = ReentrantLock()
              private val bgId = AtomicInteger(1000000)

              @Volatile var autoModel: String? = null
              private val bad: MutableSet<String> = ConcurrentHashMap.newKeySet()

              fun init(ctx: Context) {
                  if (!inited) {
                      app = ctx.applicationContext
                      inited = true
                  }
              }

              fun prefs() = app.getSharedPreferences("novax", Context.MODE_PRIVATE)
              fun p(k: String, d: String = ""): String = prefs().getString(k, d) ?: d

              fun resetModel() {
                  autoModel = null
                  bad.clear()
              }

              // ---------- UI'a olay gonderme (UI kapaliysa sirada bekler) ----------
              fun emit(code: String) {
                  val s = sink
                  if (s != null) {
                      s(code)
                  } else {
                      queue.add(code)
                      while (queue.size > 300) queue.poll()
                  }
              }

              fun flush() {
                  val s = sink ?: return
                  while (true) {
                      val c = queue.poll() ?: break
                      s(c)
                  }
              }

              private fun emitTasks() { emit("onTasks(${tasks.size})") }
              private fun step(t: Task, text: String) { emit("onAgentStep(${t.id},${JSONObject.quote(text)})") }

