              // ---------- Arac uygulamalari ----------
              private fun uiGate(t: Task, needSvc: Boolean): String? {
                  if (needSvc && NovaxAccess.inst == null) return NO_ACC
                  if (!t.hasUi) {
                      var announced = false
                      while (!uiLock.tryLock(400, TimeUnit.MILLISECONDS)) {
                          if (t.cancelled) return "Görev durduruldu."
                          if (!announced) {
                              announced = true
                              step(t, "Sırada: başka bir görev ekranı kullanıyor, bekliyorum")
                          }
                      }
                      t.hasUi = true
                  }
                  return null
              }

              private fun withAcc(t: Task, block: (NovaxAccess) -> String): String {
                  val gate = uiGate(t, true)
                  if (gate != null) return gate
                  val svc = NovaxAccess.inst ?: return NO_ACC
                  return block(svc)
              }

              private fun runTool(t: Task, name: String, a: JSONObject): String = when (name) {
                  "open_app" -> toolOpenApp(t, a.optString("name"))
                  "list_apps" -> toolListApps(a.optString("query"))
                  "play_search" -> toolPlaySearch(t, a.optString("query"))
                  "open_url" -> toolOpenUrl(t, a.optString("url"))
                  "read_screen" -> withAcc(t) { it.dump() }
                  "click" -> withAcc(t) { it.clickText(a.optString("text"), a.optBoolean("long", false)) }
                  "click_index" -> withAcc(t) { it.clickIndex(a.optInt("index", -1), a.optBoolean("long", false)) }
                  "tap" -> withAcc(t) { it.tapAt(a.optInt("x").toFloat(), a.optInt("y").toFloat()) }
                  "type_text" -> withAcc(t) { it.typeText(a.optString("text"), a.optBoolean("submit", false), a.optBoolean("replace", false)) }
                  "scroll" -> withAcc(t) { it.scroll(a.optString("direction", "down")) }
                  "press" -> withAcc(t) { it.press(a.optString("key", "back")) }
                  "wait" -> {
                      val s = a.optDouble("seconds", 1.0).coerceIn(0.2, 10.0)
                      Thread.sleep((s * 1000).toLong())
                      "Beklendi: $s sn"
                  }
                  "screenshot" -> withAcc(t) { it.screenshot() }
                  "phone_command" -> {
                      val r = runCommand(a.optString("text"))
                      if (r.isEmpty()) "Bu komut anlaşılmadı. Desteklenenler: fener, alarm, zamanlayıcı, ses, pil, saat, tarih, YouTube araması." else r
                  }
                  "find_contact" -> toolFindContact(a.optString("name"))
                  "call" -> toolCall(a.optString("number"))
                  "send_sms" -> toolSms(a.optString("number"), a.optString("text"))
                  "ask_gemini" -> toolGemini(a.optString("question"))
                  "http_get" -> toolHttpGet(a.optString("url"))
                  "create_file" -> toolCreateFile(a.optString("name"), a.optString("content"))
                  "read_file" -> toolReadFile(a.optString("name"))
                  "list_files" -> toolListFiles()
                  else -> "HATA: bilinmeyen araç: $name"
              }

              private fun toolOpenApp(t: Task, q: String): String {
                  if (q.isBlank()) return "HATA: uygulama adı boş"
                  val gate = uiGate(t, false)
                  if (gate != null) return gate
                  val hits = resolveApp(q)
                  val best = hits.firstOrNull()
                  if (best == null) {
                      return "HATA: '$q' için kurulu uygulama bulunamadı. list_apps ile farklı yazımları dene, olmazsa play_search ile Play Store'da ara."
                  }
                  if (best.score < 0.75) {
                      return "Emin değilim. En yakın uygulamalar: " +
                          hits.take(5).joinToString("; ") { it.label + " (" + it.pkg + ")" } +
                          ". Doğru olanı open_app ile tam adıyla aç veya play_search kullan."
                  }
                  val li = app.packageManager.getLaunchIntentForPackage(best.pkg) ?: return "HATA: ${best.label} açılamadı."
                  if (!launch(li)) return "HATA: ${best.label} başlatılamadı (arka plan kısıtı olabilir; Ayarlar'dan 'üstünde göster' iznini ver)."
                  val seen = waitForeground(best.pkg, 6000)
                  return "Açıldı: ${best.label}" + (if (seen) "" else " (ön plana geldiği doğrulanamadı, read_screen ile kontrol et)")
              }

              private fun toolListApps(q: String): String {
                  val hits = resolveApp(q)
                  if (hits.isEmpty()) return "Eşleşen uygulama yok: $q"
                  return hits.take(8).joinToString("\n") { it.label + " (" + it.pkg + ")" }
              }

              private fun toolPlaySearch(t: Task, q: String): String {
                  if (q.isBlank()) return "HATA: arama boş"
                  val gate = uiGate(t, false)
                  if (gate != null) return gate
                  val market = Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=" + Uri.encode(q) + "&c=apps"))
                  market.setPackage("com.android.vending")
                  var ok = launch(market)
                  if (!ok) ok = launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/search?q=" + Uri.encode(q) + "&c=apps")))
                  if (!ok) return "HATA: Play Store açılamadı."
                  waitForeground("com.android.vending", 6000)
                  Thread.sleep(1200)
                  return "Play Store araması açıldı: '$q'. read_screen ile sonuçlara bak, uygulamanın adına click ile dokun, sonra 'Yükle' düğmesine bas."
              }

              private fun toolOpenUrl(t: Task, url: String): String {
                  if (url.isBlank()) return "HATA: adres boş"
                  val gate = uiGate(t, false)
                  if (gate != null) return gate
                  return if (launch(Intent(Intent.ACTION_VIEW, Uri.parse(url)))) {
                      Thread.sleep(1200)
                      "Açıldı: $url"
                  } else "HATA: açılamadı: $url"
              }

              private fun toolFindContact(q: String): String {
                  if (app.checkSelfPermission(android.Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      return "HATA: Rehber izni yok. Kullanıcı Ayarlar > Ajan ve izinler > Mikrofon, bildirim, rehber... iznini vermeli."
                  }
                  val want = norm(q)
                  if (want.isEmpty()) return "HATA: isim boş"
                  val out = ArrayList<Triple<Double, String, String>>()
                  val cur = app.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ), null, null, null
                  )
                  cur?.use { c ->
                      val ni = c.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                      val pi = c.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                      var n = 0
                      while (c.moveToNext() && n++ < 5000) {
                          val name = c.getString(ni) ?: continue
                          val num = c.getString(pi) ?: continue
                          val s = textScore(want, norm(name))
                          if (s >= 0.6) out.add(Triple(s, name, num))
                      }
                  }
                  if (out.isEmpty()) return "Rehberde '$q' bulunamadı."
                  return out.sortedByDescending { it.first }.take(5).joinToString("\n") { it.second + ": " + it.third }
              }

              private fun cleanNumber(n: String) = n.filter { it.isDigit() || it == '+' || it == '*' || it == '#' }

              private fun toolCall(number: String): String {
                  val num = cleanNumber(number)
                  if (num.length < 3) return "HATA: geçersiz numara"
                  val uri = Uri.parse("tel:" + Uri.encode(num))
                  return if (app.checkSelfPermission(android.Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      if (launch(Intent(Intent.ACTION_CALL, uri))) "Aranıyor: $num" else "HATA: arama başlatılamadı"
                  } else {
                      launch(Intent(Intent.ACTION_DIAL, uri))
                      "Arama izni yok; numara çevirici açıldı: $num. Kullanıcı arama tuşuna basmalı."
                  }
              }

              @Suppress("DEPRECATION")
              private fun smsManager(): SmsManager =
                  if (Build.VERSION.SDK_INT >= 31) app.getSystemService(SmsManager::class.java) else SmsManager.getDefault()

              private fun toolSms(number: String, text: String): String {
                  val num = cleanNumber(number)
                  if (num.length < 3 || text.isBlank()) return "HATA: numara veya metin eksik"
                  if (app.checkSelfPermission(android.Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                      launch(Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:$num")).putExtra("sms_body", text))
                      return "SMS izni yok; mesaj ekranı hazırlandı, kullanıcı gönder tuşuna basmalı."
                  }
                  val sm = smsManager()
                  val parts = sm.divideMessage(text)
                  sm.sendMultipartTextMessage(num, null, parts, null, null)
                  return "SMS gönderildi: $num"
              }

              private fun postJson(url: String, headers: Map<String, String>, body: String): Pair<Int, String> {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 60000
                  c.setRequestProperty("Content-Type", "application/json")
                  for ((k, v) in headers) c.setRequestProperty(k, v)
                  c.doOutput = true
                  c.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  val text = (if (code in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                  c.disconnect()
                  return Pair(code, text)
              }

              private fun toolGemini(q: String): String {
                  val key = p("gemini_key")
                  if (key.isBlank()) return "HATA: Gemini API anahtarı girilmemiş (Ayarlar > Ajan ve izinler). Alternatif: Gemini uygulamasını open_app ile aç, soruyu yaz, cevabı read_screen ile oku."
                  if (q.isBlank()) return "HATA: soru boş"
                  val model = p("gemini_model", "gemini-2.5-flash").ifBlank { "gemini-2.5-flash" }
                  val body = JSONObject().put(
                      "contents", JSONArray().put(
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", q)))
                      )
                  )
                  val (code, text) = postJson(
                      "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent",
                      mapOf("x-goog-api-key" to key), body.toString()
                  )
                  if (code !in 200..299) {
                      val m = try { JSONObject(text).getJSONObject("error").optString("message") } catch (e: Exception) { "" }
                      return "HATA: Gemini HTTP $code " + m.take(200)
                  }
                  val parts = JSONObject(text).getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts")
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                  return sb.toString().trim().ifEmpty { "Gemini boş cevap verdi." }
              }

              private fun toolHttpGet(url: String): String {
                  if (!(url.startsWith("http://") || url.startsWith("https://"))) return "HATA: adres http veya https ile başlamalı"
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 20000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) Novax")
                  val code = c.responseCode
                  val raw = (if (code in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader(Charsets.UTF_8)?.use { r ->
                          val buf = CharArray(8192)
                          val sb = StringBuilder()
                          while (sb.length < 300000) {
                              val n = r.read(buf)
                              if (n < 0) break
                              sb.append(buf, 0, n)
                          }
                          sb.toString()
                      } ?: ""
                  c.disconnect()
                  val text = raw
                      .replace(Regex("(?is)<script.*?</script>"), " ")
                      .replace(Regex("(?is)<style.*?</style>"), " ")
                      .replace(Regex("(?s)<[^>]+>"), " ")
                      .replace("&nbsp;", " ").replace("&amp;", "&").replace("&quot;", "\"")
                      .replace("&lt;", "<").replace("&gt;", ">")
                      .replace(Regex("\\s+"), " ").trim()
                  return "HTTP $code\n" + text.take(4500)
              }

              private fun mimeOf(name: String): String {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
              }

              private fun safeName(n: String): String {
                  val s = n.replace(Regex("[\\\\/:*?\"<>|]"), "_").trim().ifBlank { "novax.txt" }
                  return if (s.contains('.')) s else "$s.txt"
              }

              private fun toolCreateFile(name0: String, content: String): String {
                  val name = safeName(name0)
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, mimeOf(name))
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/Novax")
                      val uri = app.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                          ?: return "HATA: dosya oluşturulamadı"
                      app.contentResolver.openOutputStream(uri)?.use { it.write(content.toByteArray(Charsets.UTF_8)) }
                      return "Dosya oluşturuldu: İndirilenler/Novax/$name (${content.length} karakter)"
                  }
                  val dir = app.getExternalFilesDir("Novax") ?: app.filesDir
                  dir.mkdirs()
                  File(dir, name).writeText(content)
                  return "Dosya oluşturuldu: ${dir.absolutePath}/$name"
              }

              private fun toolReadFile(name0: String): String {
                  val name = safeName(name0)
                  if (Build.VERSION.SDK_INT >= 29) {
                      val c = app.contentResolver.query(
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          arrayOf(MediaStore.MediaColumns._ID),
                          MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?",
                          arrayOf(name, "Download/Novax%"),
