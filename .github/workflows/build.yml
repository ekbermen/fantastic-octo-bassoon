name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proje && cd proje
          mkdir -p app/src/main/java/com/novax/app app/src/main/assets app/src/main/res/xml app/src/main/res/values
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.novax.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.novax.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "0.3"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:label="Novax"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|smallestScreenSize|screenLayout"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NovaxService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="personal_voice_assistant" />
                  </service>

                  <service
                      android:name=".NovaxAccess"
                      android:exported="true"
                      android:label="Novax"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/novax_access" />
                  </service>

                  <receiver
                      android:name=".CommandReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/novax_access.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/acc_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100" />
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="acc_desc">Novax, senin verdiğin komutlarla uygulamaları açmak, ekrana dokunmak, yazı yazmak, ekranı okumak ve ekran görüntüsü almak için bu izni kullanır. Ödeme ve şifre adımlarına dokunmaz.</string>
          </resources>
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Novax</title>
          <style>
          :root{--bg:#06090f;--panel:#0d131d;--line:#1b2636;--text:#e6edf6;--mute:#7d8da3;--c1:#22d3ee;--c2:#8b5cf6;--err:#f87171;--o1:#22d3ee;--o2:#8b5cf6}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
          html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
          body[data-state=listening]{--o1:#34d399;--o2:#22d3ee}
          body[data-state=thinking]{--o1:#fbbf24;--o2:#f97316}
          body[data-state=speaking]{--o1:#a78bfa;--o2:#22d3ee}
          #app{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 55% at 50% -8%,#12304a 0%,transparent 62%),var(--bg)}
          header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
          .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3em;font-size:15px}
          #mname{font-size:11px;color:var(--mute);margin:3px 0 0 18px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .dot{width:8px;height:8px;border-radius:50%;background:#475569}
          .dot.on{background:#34d399;box-shadow:0 0 10px #34d399}
          .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);display:grid;place-items:center}
          svg{display:block}
          #stage{display:flex;flex-direction:column;align-items:center;padding:2px 0 6px;transition:all .25s;overflow:hidden;max-height:230px}
          .kb #stage{max-height:0;opacity:0;padding:0}
          .orb{position:relative;width:120px;height:120px;margin:8px 0 4px;--lvl:0}
          .orb b{position:absolute;inset:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--o1) 38%,var(--o2) 100%);box-shadow:0 0 44px color-mix(in srgb,var(--o1) 55%,transparent),inset 0 0 18px #ffffff40;transition:transform .12s}
          .orb i{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--o1) 40%,transparent)}
          .orb i:nth-child(1){inset:10px}
          .orb i:nth-child(2){inset:0;border-color:color-mix(in srgb,var(--o2) 35%,transparent)}
          .orb i:nth-child(3){inset:-10px;border-color:color-mix(in srgb,var(--o1) 18%,transparent)}
          body[data-state=idle] .orb b{animation:breathe 4s ease-in-out infinite}
          body[data-state=listening] .orb b{transform:scale(calc(1 + var(--lvl)*.32))}
          body[data-state=listening] .orb i:nth-child(2){animation:ping 1.4s ease-out infinite}
          body[data-state=thinking] .orb i{border-style:dashed;animation:spin 3s linear infinite}
          body[data-state=thinking] .orb i:nth-child(2){animation-direction:reverse}
          body[data-state=thinking] .orb b{animation:breathe 1.2s ease-in-out infinite}
          body[data-state=speaking] .orb b{animation:talk .7s ease-in-out infinite}
          @keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.05)}}
          @keyframes talk{0%,100%{transform:scale(.95)}25%{transform:scale(1.1)}50%{transform:scale(1)}75%{transform:scale(1.14)}}
          @keyframes spin{to{transform:rotate(360deg)}}
          @keyframes ping{0%{transform:scale(1);opacity:1}100%{transform:scale(1.35);opacity:0}}
          #status{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
          #caption{min-height:20px;margin-top:6px;padding:0 24px;text-align:center;font-size:14px;color:#a5f3fc}
          #chat{flex:1;overflow-y:auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px}
          .msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere;animation:in .25s ease}
          @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          .msg.user{align-self:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 55%,#000),color-mix(in srgb,var(--c2) 70%,#000));border-bottom-right-radius:6px}
          .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
          .msg.err{border-color:#7f1d1d;color:var(--err)}
          .msg code{background:#070b12;padding:1px 5px;border-radius:5px;font-size:13px;font-family:ui-monospace,monospace}
          .msg pre{background:#070b12;padding:10px;border-radius:10px;font-size:12.5px;font-family:ui-monospace,monospace;overflow-x:auto;margin:6px 0;white-space:pre-wrap}
          .acts{display:flex;gap:16px;margin-top:8px}
          .acts button{background:none;border:none;color:var(--mute);font-size:12px;padding:2px 0}
          .acts button:active{color:var(--c1)}
          .dots{display:flex;gap:5px;padding:14px 16px}
          .dots span{width:7px;height:7px;border-radius:50%;background:var(--c1);animation:bl 1s infinite}
          .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
          @keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
          #empty{margin:auto;text-align:center;color:var(--mute);font-size:14px;padding:0 16px}
          #empty h2{color:var(--text);font-size:18px;margin-bottom:6px;font-weight:600}
          .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
          .chip{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);border-radius:16px;padding:8px 13px;font-size:13px}
          footer{padding:8px 12px 12px;display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);background:rgba(6,9,15,.92)}
          #inp{flex:1;resize:none;max-height:110px;min-height:46px;padding:12px 16px;border-radius:23px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:15px;outline:none}
          #inp:focus{border-color:var(--c1)}
          .round{width:46px;height:46px;border-radius:50%;border:none;display:grid;place-items:center;flex:none;color:#fff}
          #send{background:var(--c1);color:#041016}
          #send.stop{background:#ef4444;color:#fff}
          #mic{background:linear-gradient(135deg,var(--c1),var(--c2))}
          #mic.live{background:#ef4444}
          #sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:9;transition:opacity .2s}
          #sheet.hide{opacity:0;pointer-events:none}
          .card{width:100%;max-height:92%;overflow-y:auto;background:#0b111a;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px 28px;transition:transform .25s}
          #sheet.hide .card{transform:translateY(40px)}
          .card h3{font-size:17px;margin-bottom:4px}
          .card h4{font-size:13px;color:var(--c1);margin:22px 0 2px;padding-top:14px;border-top:1px solid var(--line);font-weight:600}
          .card h4:first-of-type{border-top:none;padding-top:0;margin-top:14px}
          .card label{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
          .hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
          .inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;outline:none;resize:vertical}
          .inp:focus{border-color:var(--c1)}
          input[type=range]{width:100%;accent-color:var(--c1)}
          .btn{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:14px}
          .btn.wide{width:100%;margin-top:10px}
          .btn.danger{color:var(--err)}
          .btn:disabled{opacity:.6}
          .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
          .seg button{flex:1;padding:10px;background:none;border:none;color:var(--mute);font-size:14px}
          .seg button.on{background:#12304a;color:#a5f3fc}
          .item{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
          .sw{width:48px;height:28px;border-radius:14px;border:none;background:#243044;position:relative;transition:background .2s;flex:none}
          .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
          .sw.on{background:#10b981}.sw.on::after{transform:translateX(20px)}
          .wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
          .mini{padding:7px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font-size:13px}
          .mini.on{background:#12304a;border-color:var(--c1);color:#a5f3fc}
          .sw2{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
          .sw2.on{border-color:#fff}
          #toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#1e293b;color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:20;max-width:85%;text-align:center}
          #toast.show{opacity:1;transform:translate(-50%,0)}
          #perm{margin:4px 14px 0;padding:10px 12px;border:1px solid #7c2d12;background:#1c1008;color:#fdba74;border-radius:12px;font-size:13px;display:none;align-items:center;justify-content:space-between;gap:10px}
          #perm button{border:none;background:#f97316;color:#1c1008;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;flex:none}
          #tasks{display:none;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);background:#0b111a;font-size:13px;color:#fbbf24}
          #tasks.on{display:flex}
          #tasks button{border:1px solid #7f1d1d;background:none;color:var(--err);border-radius:10px;padding:5px 12px;font-size:13px}
          .msg.work{background:var(--panel);border:1px dashed #334155;color:var(--mute);font-size:13px}
          .msg.work .ln{padding:2px 0}
          .steps{margin-top:8px;font-size:12px;color:var(--mute)}
          .steps summary{padding:2px 0}
          .pill{font-size:11px;padding:3px 8px;border-radius:10px;background:#3b1d1d;color:#fca5a5;margin-left:8px}
          .pill.ok{background:#0f2e22;color:#6ee7b7}
          .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:14px;gap:8px}
          .row .mini{flex:none}
          </style>
          </head>
          <body data-state="idle">
          <div id="app">
            <header>
              <div>
                <div class="brand"><span class="dot" id="dot"></span>NOVAX</div>
                <div id="mname"></div>
              </div>
              <button class="iconbtn" id="gear" aria-label="Ayarlar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
              </button>
            </header>
            <div id="perm"><span>Ekran kontrolü kapalı. Novax'ın uygulamaları yönetebilmesi için erişilebilirlik izni ver.</span><button>İzin ver</button></div>
            <section id="stage">
              <div class="orb" id="orb"><i></i><i></i><i></i><b></b></div>
              <div id="status">Hazır</div>
              <div id="caption"></div>
            </section>
            <main id="chat">
              <div id="empty">
                <h2>Merhaba, ben Novax</h2>
                Yazabilir ya da mikrofona basıp konuşabilirsin. Telefonu da yönetirim: uygulama açma, dokunma, yazı yazma, ekran görüntüsü, dosya, arama, indirme… Aynı anda birden fazla iş verebilirsin.
                <div class="chips">
                  <button class="chip">Kendini tanıt</button>
                  <button class="chip">Saat kaç?</button>
                  <button class="chip">Fener aç</button>
                  <button class="chip">Play Store'dan Efootball'u indir</button>
                  <button class="chip">Notlar'ı aç ve alışveriş listesi yaz</button>
                  <button class="chip">Ekran görüntüsü al</button>
                  <button class="chip">Gemini'ye sor: Ay'a ilk kim gitti?</button>
                  <button class="chip">Notlar.txt adlı dosya oluştur</button>
                </div>
              </div>
            </main>
            <div id="tasks"><span id="tcount"></span><button id="tstop">Durdur</button></div>
            <footer>
              <textarea id="inp" rows="1" placeholder="Bir mesaj yaz…"></textarea>
              <button class="round" id="mic" aria-label="Konuş">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
              </button>
              <button class="round" id="send" aria-label="Gönder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
              </button>
            </footer>
          </div>

          <div id="sheet" class="hide">
            <div class="card">
              <h3>Ayarlar</h3>

              <h4>Yapay zekâ</h4>
              <div class="seg" data-k="provider" data-d="groq"><button data-v="groq">Groq (bulut)</button><button data-v="local">Yerel AI</button></div>

              <div id="pgroq">
                <label>Groq API anahtarı</label>
                <input class="inp" type="password" data-pref="groq_key" placeholder="gsk_..." autocomplete="off">
                <label>Model (Otomatik: hesabında çalışan en iyi modeli seçer)</label>
                <input class="inp" data-pref="model" data-def="auto" autocomplete="off" autocapitalize="off">
                <div class="hint">"Model yok / erişimin yok" hatası alırsan Novax modeli kendisi değiştirir ve tekrar dener.</div>
              </div>

              <div id="plocal">
                <label>Sunucu adresi (OpenAI uyumlu)</label>
                <input class="inp" data-pref="local_url" data-def="http://127.0.0.1:11434/v1" autocomplete="off" autocapitalize="off">
                <label>Model adı</label>
                <input class="inp" data-pref="local_model" data-def="llama3.2" autocomplete="off" autocapitalize="off">
                <label>API anahtarı (gerekmiyorsa boş bırak)</label>
                <input class="inp" type="password" data-pref="local_key" autocomplete="off">
                <div class="hint">Ollama, LM Studio ve llama.cpp server çalışır. Telefonda Termux'ta Ollama için adres 127.0.0.1:11434/v1, bilgisayardaki sunucu için http://192.168.x.x:11434/v1 yaz (Ollama'yı OLLAMA_HOST=0.0.0.0 ile başlat). İnternet gerekmez.</div>
              </div>

              <button class="btn wide" id="models">Modelleri getir / bağlantıyı test et</button>
              <div class="wrap" id="mchips"></div>

              <h4>Kişilik ve hafıza</h4>
              <div class="wrap" id="pers"></div>
              <textarea class="inp" id="persona" data-pref="persona" rows="3" style="margin-top:10px" placeholder="Kendi kişiliğini yaz. Boş bırakırsan varsayılan kullanılır."></textarea>
              <label>Benim hakkımda (Novax her sohbette bilsin)</label>
              <textarea class="inp" data-pref="about" rows="2" placeholder="Adım Ali, İstanbul'da yaşıyorum, yazılımcıyım…"></textarea>
              <label>Yaratıcılık: <span id="rv_temp"></span></label>
              <input type="range" min="0" max="1.2" step="0.1" data-pref="temp" data-def="0.7">

              <h4>Ses</h4>
              <div class="seg" data-k="vm" data-d="auto"><button data-v="auto">Otomatik</button><button data-v="always">Hep</button><button data-v="off">Kapalı</button></div>
              <div class="hint">Otomatik: sesle sorarsan sesle, yazarsan yazıyla cevap verir.</div>
              <label>Dil</label>
              <div class="seg" data-k="lang" data-d="tr-TR"><button data-v="tr-TR">Türkçe</button><button data-v="en-US">English</button></div>
              <label>Konuşma hızı: <span id="rv_rate"></span></label>
              <input type="range" min="0.6" max="1.6" step="0.1" data-pref="rate" data-def="1.0">
              <label>Ses tonu: <span id="rv_pitch"></span></label>
              <input type="range" min="0.6" max="1.4" step="0.1" data-pref="pitch" data-def="1.0">
              <div class="item"><span>Sürekli sohbet (cevaptan sonra tekrar dinle)</span><button class="sw" data-k="cont" data-d="0"></button></div>
              <button class="btn wide" id="tts">Sesi dene</button>

              <h4>Telefon</h4>
              <div class="item"><span>Telefon komutları</span><button class="sw" data-k="cmd" data-d="1"></button></div>
              <div class="hint">Örnek: "fener aç", "youtube aç", "10 dakika zamanlayıcı kur", "07:30 alarm kur", "sesi kıs", "pil kaç", "youtube'da lofi ara", "0555 123 45 67 ara".</div>
              <div class="item"><span>Arka plan servisi</span><button class="sw" id="svc" aria-label="Servis"></button></div>
              <button class="btn wide" id="batt">Pil kısıtlamasını kaldır</button>

              <h4>Ajan ve izinler</h4>
              <div class="item"><span>Ajan modu (telefonu araçlarla yönet)</span><button class="sw" data-k="agent" data-d="1"></button></div>
              <div class="hint">Açıkken Novax uygulama açar, ekrana dokunur, yazı yazar, ekran görüntüsü alır, dosya oluşturur, Gemini'ye sorar. Kapalıyken sadece sohbet eder. Ödeme ve şifre adımlarını asla kendisi yapmaz.</div>
              <div class="row"><span>Erişilebilirlik (ekran kontrolü)<span class="pill" id="p_acc">kapalı</span></span><button class="mini" id="b_acc">İzin ver</button></div>
              <div class="hint">Açılan listede Novax'ı bul ve aç. Düğme gri ise: Uygulama bilgisi > sağ üst ⋮ > Kısıtlanmış ayarlara izin ver, sonra tekrar dene.</div>
              <div class="row"><span>Diğer uygulamaların üstünde göster<span class="pill" id="p_ovl">kapalı</span></span><button class="mini" id="b_ovl">İzin ver</button></div>
              <div class="row"><span>Arka planda sınırsız çalış<span class="pill" id="p_bat">kapalı</span></span><button class="mini" id="b_bat">İzin ver</button></div>
              <div class="row"><span>Mikrofon, bildirim, rehber, arama, SMS<span class="pill" id="p_rt">eksik</span></span><button class="mini" id="b_rt">İzin ver</button></div>
              <button class="btn wide" id="b_info">Uygulama bilgisini aç</button>
              <label>Gemini API anahtarı (arka planda Gemini'ye soru için)</label>
              <input class="inp" type="password" data-pref="gemini_key" placeholder="AIza..." autocomplete="off">
              <label>Gemini modeli</label>
              <input class="inp" data-pref="gemini_model" data-def="gemini-2.5-flash" autocomplete="off" autocapitalize="off">

              <h4>Görünüm</h4>
              <div class="wrap" id="acc"></div>

              <h4>Sohbet</h4>
              <button class="btn wide" id="share">Sohbeti paylaş</button>
              <button class="btn wide danger" id="clear">Sohbeti temizle</button>
              <button class="btn wide" id="close">Kapat</button>
            </div>
          </div>
          <div id="toast"></div>

          <script>
          const $=s=>document.querySelector(s);
          const A=window.Android;
          let state='idle',busy=false,history=[],pending={},nid=0,voiceMode='auto',lastVoice=false;
          try{history=JSON.parse(localStorage.getItem('nx_hist')||'[]')}catch(e){}
          const getP=(k,d)=>A?A.getPref(k,d):d;
          const setP=(k,v)=>{if(A)A.setPref(k,String(v))};
          voiceMode=getP('vm','auto');
          function save(){try{localStorage.setItem('nx_hist',JSON.stringify(history.slice(-60)))}catch(e){}}
          const LABEL={idle:'Hazır',listening:'Dinliyorum…',thinking:'Düşünüyorum…',speaking:'Konuşuyorum…'};
          const SEND_SVG=$('#send').innerHTML;
          const STOP_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';
          function setState(s){
            state=s;document.body.dataset.state=s;$('#status').textContent=LABEL[s];
            $('#mic').classList.toggle('live',s==='listening'||s==='speaking');
            if(s!=='listening'){$('#orb').style.setProperty('--lvl',0)}
            if(s==='idle'||s==='speaking')$('#caption').textContent='';
          }
          function setSendMode(b){const s=$('#send');s.classList.toggle('stop',b);s.innerHTML=b?STOP_SVG:SEND_SVG}
          function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
          function refreshModel(){$('#mname').textContent=A?A.modelName():''}
          function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
          function strip(t){return t.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').trim()}
          function md(t){
            const blocks=[];
            let h=esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c.replace(/\n$/,''));return '\u0000'+(blocks.length-1)+'\u0000'});
            h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>')
               .replace(/^#{1,4}\s+(.+)$/gm,'<b>$1</b>')
               .replace(/^\s*[-*]\s+/gm,'• ')
               .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
               .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>')
               .replace(/\n/g,'<br>');
            return h.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<pre>'+blocks[i]+'</pre>');
          }
          function clean(t){return t.replace(/```[\s\S]*?```/g,' kod bloğu ').replace(/[*_`#>~]/g,'').replace(/\s+/g,' ').trim()}
          function scrollDown(){const c=$('#chat');c.scrollTop=c.scrollHeight}
          function hideEmpty(){const e=$('#empty');if(e)e.style.display='none'}
          function bubble(role,cls){const d=document.createElement('div');d.className='msg '+role+(cls?' '+cls:'');$('#chat').appendChild(d);return d}
          function trimRegen(){
            const all=document.querySelectorAll('#chat .msg.bot:not(.err):not(.dots)');
            all.forEach((m,i)=>{const r=m.querySelector('[data-a=regen]');if(r)r.style.display=i===all.length-1?'':'none'});
          }
          function fin(d,text,steps){
            d.dataset.raw=text;
            let st='';
            if(steps&&steps.length)st='<details class="steps"><summary>'+steps.length+' adım</summary>'+steps.map(s=>'<div>'+esc(s)+'</div>').join('')+'</details>';
            d.innerHTML=md(text)+st+'<div class="acts"><button data-a="copy">Kopyala</button><button data-a="speak">Oku</button><button data-a="regen">Yenile</button></div>';
            trimRegen();scrollDown();
          }
          function addMsg(role,text,cls){
            const d=bubble(role,cls);
            if(role==='user')d.innerHTML=esc(text).replace(/\n/g,'<br>');
            else if(cls==='err')d.innerHTML=md(text);
            else fin(d,text);
            scrollDown();return d;
          }
          function showDots(){const d=bubble('bot','dots');d.id='dots';d.innerHTML='<span></span><span></span><span></span>';scrollDown()}
          function hideDots(){const d=$('#dots');if(d)d.remove()}
          function wantSpeak(v){return voiceMode==='always'||(voiceMode==='auto'&&v)}

          function send(text,viaVoice){
            text=(text||'').trim();
            if(!text)return;
            if(!A){toast('Bu sayfa sadece Novax uygulamasında çalışır');return}
            hideEmpty();
            A.stopSpeaking();
            lastVoice=!!viaVoice;
            const cmd=getP('cmd','1')==='1'?A.command(text):'';
            if(cmd){
              addMsg('user',text);addMsg('bot',cmd);
              history.push({role:'user',content:text},{role:'assistant',content:cmd});save();
              if(wantSpeak(viaVoice)){setState('speaking');A.speak(clean(cmd))}
              return;
            }
            if(!A.ready()){openSheet();toast('Önce yapay zekâ bağlantısını ayarla');return}
            addMsg('user',text);
            history.push({role:'user',content:text});save();
            ask(viaVoice);
          }
          let tasksN=0;
          function updateTasks(){
            const n=Math.max(tasksN,Object.keys(pending).length);
            $('#tasks').classList.toggle('on',n>0);
            $('#tcount').textContent=n>1?n+' görev çalışıyor…':'1 görev çalışıyor…';
            if(n>0&&state==='idle')setState('thinking');
            if(n===0&&state==='thinking')setState('idle');
          }
          function ask(v){
            const id=++nid;
            const agent=getP('agent','1')==='1';
            const h=JSON.stringify(history.slice(-14));
            pending[id]={voice:!!v,el:null,buf:'',raf:0,steps:[],agent:agent};
            if(agent){
              const el=bubble('bot','work');el.innerHTML='<div class="ln">Görev başladı…</div>';
              pending[id].el=el;scrollDown();
              updateTasks();A.agent(id,h);
            }else{
              showDots();updateTasks();A.chat(id,h);
            }
          }
          function regen(){
            if(!A)return;
            if(!A.ready()){openSheet();return}
            if(history.length&&history[history.length-1].role==='assistant'){history.pop();save()}
            const ms=document.querySelectorAll('#chat .msg.bot:not(.err)');
            if(ms.length)ms[ms.length-1].remove();
            if(!history.length||history[history.length-1].role!=='user')return;
            ask(lastVoice);
          }
          window.onToken=function(id,d){
            const p=pending[id];if(!p)return;
            if(!p.el){hideDots();p.el=bubble('bot')}
            p.buf+=d;
            if(!p.raf)p.raf=requestAnimationFrame(()=>{p.raf=0;p.el.innerHTML=md(strip(p.buf));scrollDown()});
          };
          window.onAgentStep=function(id,t){
            const p=pending[id];if(!p||!p.el)return;
            p.steps.push(t);
            if(p.el.classList.contains('work')){
              p.el.innerHTML=p.steps.slice(-5).map(s=>'<div class="ln">⚙ '+esc(s)+'</div>').join('');
              scrollDown();
            }
          };
          window.onTasks=function(n){tasksN=n;updateTasks()};
          window.onExternalUser=function(t){hideEmpty();addMsg('user',t);history.push({role:'user',content:t});save()};
          window.onChatResult=function(id,ok,text){
            const p=pending[id];delete pending[id];hideDots();refreshModel();
            if(!p){
              hideEmpty();
              if(ok){const o=strip(text);if(o){const e=bubble('bot');fin(e,o);history.push({role:'assistant',content:o});save()}}
              else addMsg('bot',text,'err');
              updateTasks();return;
            }
            if(p.raf)cancelAnimationFrame(p.raf);
            if(!ok){
              if(p.el)p.el.remove();
              addMsg('bot',text,'err');
              if(!p.agent&&history.length&&history[history.length-1].role==='user'){history.pop();save()}
              updateTasks();return;
            }
            const out=strip(text);
            if(!out){if(p.el)p.el.remove();updateTasks();return}
            const el=p.el||bubble('bot');
            el.className='msg bot';
            fin(el,out,p.steps);history.push({role:'assistant',content:out});save();
            if(wantSpeak(p.voice)){setState('speaking');A.speak(clean(out))}
            updateTasks();
          };
          window.onModelChanged=m=>{toast('Model otomatik değişti: '+m);refreshModel()};
          window.onVoiceResult=function(t){
            $('#caption').textContent='';
            if(!t){setState('idle');toast('Seni duyamadım, tekrar dene');return}
            setState('idle');send(t,true);
          };
          window.onPartial=t=>{$('#caption').textContent=t};
          window.onListenState=s=>{if(s==='listening')setState('listening');else if(s==='processing')setState('thinking')};
          window.onListenError=m=>{setState('idle');$('#caption').textContent='';toast(m)};
          window.onLevel=r=>{if(state==='listening'){$('#orb').style.setProperty('--lvl',Math.max(0,Math.min(1,(r+2)/12)).toFixed(2))}};
          window.onTts=s=>{
            if(s==='start'){setState('speaking');return}
            if(state==='speaking'){
              setState('idle');
              if(getP('cont','0')==='1'&&lastVoice)setTimeout(()=>{if(state==='idle'&&!busy)A.listen()},600);
            }
          };
          window.onServiceState=on=>{$('#dot').classList.toggle('on',!!on);$('#svc').classList.toggle('on',!!on)};
          window.toast=toast;

          $('#send').onclick=()=>{
            const i=$('#inp');const t=i.value;i.value='';i.style.height='auto';send(t,false);
          };
          $('#tstop').onclick=()=>{if(A)A.stopGen()};
          $('#inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(110,e.target.scrollHeight)+'px'});
          $('#inp').addEventListener('focus',()=>document.body.classList.add('kb'));
          $('#inp').addEventListener('blur',()=>document.body.classList.remove('kb'));
          $('#mic').onclick=()=>{
            if(!A){toast('Bu sayfa sadece Novax uygulamasında çalışır');return}
            if(state==='listening'){A.stopListen();return}
            if(state==='speaking'){A.stopSpeaking();setState('idle');return}
            if(!A.ready()){openSheet();toast('Önce yapay zekâ bağlantısını ayarla');return}
            A.listen();
          };
          document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent,false));
          $('#chat').addEventListener('click',e=>{
            const b=e.target.closest('[data-a]');if(!b||!A)return;
            const raw=b.closest('.msg').dataset.raw||'';
            const a=b.dataset.a;
            if(a==='copy')A.copy(raw);
            else if(a==='speak'){lastVoice=false;setState('speaking');A.speak(clean(raw))}
            else if(a==='regen')regen();
          });

          /* ---------- Ayarlar ---------- */
          const MTXT='Modelleri getir / bağlantıyı test et';
          const PERS={
            'Varsayılan':'',
            'Samimi':"Sen Novax'sın, Türkçe konuşan samimi, sıcak ve esprili bir arkadaşsın. Kısa ve doğal cevap ver, emoji kullanma.",
            'Öğretmen':"Sen Novax'sın, sabırlı bir öğretmensin. Konuları adım adım, basit örneklerle anlat ve sonunda kısa bir soru sor.",
            'Kodcu':"Sen Novax'sın, deneyimli bir yazılım mühendisisin. Doğru ve çalışan kod ver, kısa açıkla, kodu kod bloğu içinde yaz.",
            'Kısa ve net':"Sen Novax'sın. En fazla iki cümleyle, direkt cevap ver. Gereksiz giriş yapma.",
            'Şakacı':"Sen Novax'sın, nüktedan ve eğlenceli bir asistansın. Cevaplarına hafif espri kat ama doğruluktan ödün verme."
          };
          Object.keys(PERS).forEach(k=>{
            const b=document.createElement('button');b.className='mini';b.textContent=k;
            b.onclick=()=>{$('#persona').value=PERS[k];setP('persona',PERS[k]);toast('Kişilik: '+k)};
            $('#pers').appendChild(b);
          });
          const ACC=[['#22d3ee','#8b5cf6'],['#34d399','#a3e635'],['#f472b6','#fb923c'],['#60a5fa','#6366f1'],['#f87171','#fbbf24']];
          function setAcc(i){
            const c=ACC[i]||ACC[0],r=document.documentElement.style;
            r.setProperty('--c1',c[0]);r.setProperty('--c2',c[1]);r.setProperty('--o1',c[0]);r.setProperty('--o2',c[1]);
            try{localStorage.setItem('nx_acc',i)}catch(e){}
            document.querySelectorAll('#acc .sw2').forEach((b,j)=>b.classList.toggle('on',j===i));
          }
          ACC.forEach((c,i)=>{
            const b=document.createElement('button');b.className='sw2';
            b.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';
            b.onclick=()=>setAcc(i);$('#acc').appendChild(b);
          });
          let accI=0;try{accI=parseInt(localStorage.getItem('nx_acc')||'0',10)||0}catch(e){}
          setAcc(accI);

          function paintSeg(s){s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===getP(s.dataset.k,s.dataset.d)))}
          function paintSw(s){s.classList.toggle('on',getP(s.dataset.k,s.dataset.d)==='1')}
          function showRange(el){const s=$('#rv_'+el.dataset.pref);if(s)s.textContent=el.value}
          function showProv(){const l=getP('provider','groq')==='local';$('#pgroq').style.display=l?'none':'';$('#plocal').style.display=l?'':'none'}
          function openSheet(){
            document.querySelectorAll('[data-pref]').forEach(el=>{el.value=getP(el.dataset.pref,el.dataset.def||'');if(el.type==='range')showRange(el)});
            document.querySelectorAll('.seg[data-k]').forEach(paintSeg);
            document.querySelectorAll('.sw[data-k]').forEach(paintSw);
            showProv();refreshPerms();$('#sheet').classList.remove('hide');
          }
          function closeSheet(){$('#sheet').classList.add('hide')}
          document.querySelectorAll('[data-pref]').forEach(el=>el.addEventListener('input',()=>{
            setP(el.dataset.pref,el.value);if(el.type==='range')showRange(el);refreshModel();
          }));
          document.querySelectorAll('.seg[data-k]').forEach(s=>s.addEventListener('click',e=>{
            const b=e.target.closest('button');if(!b)return;
            setP(s.dataset.k,b.dataset.v);paintSeg(s);
            if(s.dataset.k==='provider'){showProv();$('#mchips').innerHTML=''}
            if(s.dataset.k==='vm')voiceMode=b.dataset.v;
            refreshModel();
          }));
          document.querySelectorAll('.sw[data-k]').forEach(s=>s.onclick=()=>{
            setP(s.dataset.k,getP(s.dataset.k,s.dataset.d)==='1'?'0':'1');paintSw(s);
          });
          window.onModels=function(j,err){
            const bt=$('#models');bt.disabled=false;bt.textContent=MTXT;
            if(err){toast(err);return}
            const arr=JSON.parse(j);
            if(!arr.length){toast('Hiç model bulunamadı');return}
            const local=getP('provider','groq')==='local';
            const key=local?'local_model':'model';
            const inp=document.querySelector('[data-pref='+key+']');
            const box=$('#mchips');box.innerHTML='';
            (local?arr:['auto'].concat(arr)).forEach(id=>{
              const b=document.createElement('button');b.className='mini'+(inp.value===id?' on':'');
              b.textContent=id==='auto'?'Otomatik':id;
              b.onclick=()=>{
                inp.value=id;setP(key,id);refreshModel();
                box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
              };
              box.appendChild(b);
            });
            toast(arr.length+' model bulundu, birine dokun');
          };
          $('#models').onclick=()=>{if(!A)return;const bt=$('#models');bt.disabled=true;bt.textContent='Bağlanıyor…';A.listModels()};
          $('#gear').onclick=openSheet;
          $('#close').onclick=closeSheet;
          $('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
          $('#svc').onclick=()=>{if(A)A.toggleService()};
          $('#batt').onclick=()=>{if(A)A.battery()};
          $('#tts').onclick=()=>{if(A){A.speak('Merhaba, ben Novax. Sesim böyle.');setState('speaking')}};
          $('#share').onclick=()=>{
            if(!history.length){toast('Sohbet boş');return}
            if(A)A.share(history.map(m=>(m.role==='user'?'Ben: ':'Novax: ')+m.content).join('\n\n'));
          };
          $('#clear').onclick=()=>{
            history=[];save();
            document.querySelectorAll('#chat .msg').forEach(m=>m.remove());
            $('#empty').style.display='';closeSheet();
          };

          if(history.length){hideEmpty();history.forEach(m=>addMsg(m.role==='user'?'user':'bot',m.content))}
          function refreshPerms(){
            if(!A)return;
            let s={};try{s=JSON.parse(A.perms())}catch(e){}
            const mark=(id,ok,on,off)=>{const e=$(id);if(!e)return;e.textContent=ok?on:off;e.classList.toggle('ok',!!ok)};
            mark('#p_acc',s.acc,'açık','kapalı');mark('#p_ovl',s.ovl,'açık','kapalı');
            mark('#p_bat',s.bat,'açık','kapalı');mark('#p_rt',s.rt,'tamam','eksik');
            $('#perm').style.display=s.acc?'none':'flex';
          }
          window.refreshPerms=refreshPerms;
          window.onAccState=function(){refreshPerms()};
          $('#perm button').onclick=()=>{if(A)A.openAccessibility()};
          $('#b_acc').onclick=()=>{if(A)A.openAccessibility()};
          $('#b_ovl').onclick=()=>{if(A)A.openOverlay()};
          $('#b_bat').onclick=()=>{if(A)A.battery()};
          $('#b_rt').onclick=()=>{if(A)A.askRuntimePerms()};
          $('#b_info').onclick=()=>{if(A)A.openAppInfo()};
          if(A){onServiceState(A.isServiceRunning());refreshModel();refreshPerms()}
          </script>
          </body>
          </html>
