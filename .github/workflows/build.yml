          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicReference

          class NovaxAccess : AccessibilityService() {

              companion object {
                  @Volatile var inst: NovaxAccess? = null

                  // Odeme / satin alma gibi adimlar: ajan bunlara asla kendi basina dokunmaz
                  val PAY = Regex(
                      "(satın al|satin al|ödeme|ödemeyi|öde\\b|buy now|purchase|checkout|" +
                          "₺\\s*\\d|\\d\\s*₺|\\$\\s*\\d|\\d\\s*\\$|€\\s*\\d|\\d\\s*€|£\\s*\\d|\\d\\s*tl\\b)"
                  )
              }

              private val nodes = ArrayList<AccessibilityNodeInfo>()
              private val exec = Executors.newSingleThreadExecutor()

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  inst = this
                  Engine.init(this)
                  Engine.emit("onAccState(true)")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  inst = null
                  Engine.emit("onAccState(false)")
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  inst = null
                  super.onDestroy()
              }

              // ---------- Ekrani okuma ----------
              private fun waitRoot(): AccessibilityNodeInfo? {
                  for (i in 0 until 8) {
                      val r = rootInActiveWindow
                      if (r != null) return r
                      Thread.sleep(300)
                  }
                  return null
              }

              private fun settle(ms: Long = 700) {
                  try { Thread.sleep(ms) } catch (e: Exception) {}
              }

              private fun labelOf(n: AccessibilityNodeInfo): String {
                  val t = n.text?.toString().orEmpty()
                  return if (t.isNotBlank()) t else n.contentDescription?.toString().orEmpty()
              }

              @Synchronized
              fun dump(): String {
                  val root = waitRoot() ?: return "HATA: ekran okunamadı (pencere yok veya bu uygulama erişimi engelliyor)."
                  nodes.clear()
                  val sb = StringBuilder()
                  sb.append("Uygulama: ").append(root.packageName).append('\n')
                  walk(root, sb)
                  if (nodes.isEmpty()) sb.append("(okunabilir öğe yok; ekran görüntüsü veya tap ile dene)\n")
                  return if (sb.length > 4500) sb.substring(0, 4500) + "\n...(kısaltıldı, scroll ile devam et)" else sb.toString()
              }

              private fun walk(n: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (n == null || nodes.size > 250 || sb.length > 4500) return
                  if (!n.isVisibleToUser) return
                  val text = if (n.isPassword) "" else n.text?.toString()?.trim().orEmpty()
                  val desc = n.contentDescription?.toString()?.trim().orEmpty()
                  val hint = if (n.isEditable && text.isEmpty()) n.hintText?.toString().orEmpty() else ""
                  val interesting = text.isNotEmpty() || desc.isNotEmpty() || hint.isNotEmpty() ||
                      n.isClickable || n.isEditable || n.isScrollable || n.isCheckable
                  if (interesting) {
                      val idx = nodes.size
                      nodes.add(n)
                      val r = Rect()
                      n.getBoundsInScreen(r)
                      sb.append('[').append(idx).append("] ")
                      if (text.isNotEmpty()) sb.append('"').append(text.take(80).replace('\n', ' ')).append('"')
                      if (hint.isNotEmpty()) sb.append(" (ipucu: ").append(hint.take(40)).append(')')
                      if (desc.isNotEmpty() && desc != text) sb.append(" (açıklama: ").append(desc.take(60)).append(')')
                      if (n.isClickable) sb.append(" tık")
                      if (n.isEditable) sb.append(" yazı-alanı")
                      if (n.isPassword) sb.append(" şifre")
                      if (n.isScrollable) sb.append(" kaydırılabilir")
                      if (n.isCheckable) sb.append(if (n.isChecked) " işaretli" else " işaretsiz")
                      sb.append(" @").append(r.centerX()).append(',').append(r.centerY()).append('\n')
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), sb)
              }

              private fun findFirst(n: AccessibilityNodeInfo?, pred: (AccessibilityNodeInfo) -> Boolean): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (pred(n)) return n
                  for (i in 0 until n.childCount) {
                      val r = findFirst(n.getChild(i), pred)
                      if (r != null) return r
                  }
                  return null
              }

              // ---------- Dokunma ----------
              @Synchronized
              fun clickText(target: String, long: Boolean = false): String {
                  val root = waitRoot() ?: return "HATA: ekran okunamadı."
                  val want = Engine.norm(target)
                  if (want.isEmpty()) return "HATA: dokunulacak yazı boş."
                  val cands = ArrayList<Pair<AccessibilityNodeInfo, Int>>()
                  fun visit(n: AccessibilityNodeInfo?) {
                      if (n == null) return
                      if (n.isVisibleToUser) {
                          var sc = 0
                          for (raw in listOf(n.text?.toString().orEmpty(), n.contentDescription?.toString().orEmpty())) {
                              val l = Engine.norm(raw)
                              if (l.isEmpty()) continue
                              val s = when {
                                  l == want -> 3
                                  l.startsWith(want) -> 2
                                  l.contains(want) -> 1
                                  else -> 0
                              }
                              if (s > sc) sc = s
                          }
                          if (sc > 0) cands.add(Pair(n, sc))
                      }
                      for (i in 0 until n.childCount) visit(n.getChild(i))
                  }
                  visit(root)
                  if (cands.isEmpty()) return "HATA: \"$target\" yazan görünür öğe bulunamadı. read_screen ile ekranı kontrol et veya scroll yap."
                  val pick = cands.maxByOrNull { it.second }?.first ?: return "HATA: öğe seçilemedi."
                  return performClick(pick, long)
              }

              @Synchronized
              fun clickIndex(i: Int, long: Boolean = false): String {
                  val n = nodes.getOrNull(i) ?: return "HATA: geçersiz indeks $i. Önce read_screen çağır."
                  n.refresh()
                  return performClick(n, long)
              }

              private fun performClick(n: AccessibilityNodeInfo, long: Boolean): String {
                  val label = labelOf(n)
                  if (PAY.containsMatchIn(label.lowercase(Engine.TR))) {
                      return "ENGELLENDİ: \"$label\" ödeme veya satın alma adımı gibi görünüyor. Kendin dokunma, kullanıcıya sor."
                  }
                  var cur: AccessibilityNodeInfo? = n
                  var depth = 0
                  while (cur != null && depth < 6) {
                      val can = if (long) cur.isLongClickable else cur.isClickable
                      if (can) {
                          val act = if (long) AccessibilityNodeInfo.ACTION_LONG_CLICK else AccessibilityNodeInfo.ACTION_CLICK
                          if (cur.performAction(act)) {
                              settle()
                              return "Dokunuldu: \"" + label.take(60) + "\""
                          }
                          break
                      }
                      cur = cur.parent
                      depth++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val ok = tap(r.centerX().toFloat(), r.centerY().toFloat(), if (long) 700L else 60L)
                  settle()
                  return if (ok) "Koordinata dokunuldu: \"" + label.take(60) + "\"" else "HATA: dokunma başarısız: \"" + label.take(60) + "\""
              }

              fun tapAt(x: Float, y: Float): String {
                  val ok = tap(x, y, 60L)
                  settle()
                  return if (ok) "Dokunuldu: $x,$y" else "HATA: dokunma başarısız."
              }

              private fun tap(x: Float, y: Float, dur: Long): Boolean {
                  val path = Path()
                  path.moveTo(x, y)
                  return gesture(path, dur)
              }

              private fun gesture(path: Path, dur: Long): Boolean {
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, dur))
                      .build()
                  val latch = CountDownLatch(1)
                  val ok = AtomicBoolean(false)
                  val started = dispatchGesture(g, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          ok.set(true)
                          latch.countDown()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          latch.countDown()
                      }
                  }, null)
                  if (!started) return false
                  latch.await(4, TimeUnit.SECONDS)
                  return ok.get()
              }

              // ---------- Yazi yazma ----------
              @Synchronized
              fun typeText(text: String, submit: Boolean, replace: Boolean): String {
                  val root = waitRoot() ?: return "HATA: ekran okunamadı."
                  var target: AccessibilityNodeInfo? = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  if (target == null || !target.isEditable) {
                      target = findFirst(root) { it.isEditable && it.isVisibleToUser }
                  }
                  if (target == null) return "HATA: yazı alanı bulunamadı. Önce alana click ile dokun (arama kutusu, not alanı)."
                  if (target.isPassword) return "ENGELLENDİ: şifre alanına yazmam."
                  target.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val cur = if (replace || target.isShowingHintText) "" else target.text?.toString().orEmpty()
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, cur + text)
                  var ok = target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                  if (!ok) {
                      try {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("novax", text))
                          ok = target.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                      } catch (e: Exception) {
                      }
                  }
                  if (!ok) return "HATA: yazı yazılamadı. Alana dokunup tekrar dene."
                  settle(400)
                  var note = ""
                  if (submit) {
                      if (Build.VERSION.SDK_INT >= 30) {
                          val sent = target.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                          note = if (sent) " ve Enter basıldı" else " (Enter basılamadı, arama düğmesine click ile dokun)"
                          settle()
                      } else {
                          note = " (Enter için arama düğmesine click ile dokun)"
                      }
                  }
                  return "Yazıldı: \"" + text.take(60) + "\"" + note
              }

              // ---------- Kaydirma / tuslar ----------
              @Synchronized
              fun scroll(dir: String): String {
                  val root = waitRoot() ?: return "HATA: ekran okunamadı."
                  val fwd = dir == "down" || dir == "right"
                  val sc = findFirst(root) { it.isScrollable && it.isVisibleToUser }
                  if (sc != null) {
                      val ok = sc.performAction(
                          if (fwd) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                      )
                      if (ok) {
                          settle()
                          return "Kaydırıldı: $dir"
                      }
                  }
                  return swipe(dir)
              }

              private fun swipe(dir: String): String {
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels.toFloat()
                  val h = dm.heightPixels.toFloat()
                  val p = Path()
                  when (dir) {
                      "down" -> { p.moveTo(w / 2, h * 0.72f); p.lineTo(w / 2, h * 0.28f) }
                      "up" -> { p.moveTo(w / 2, h * 0.28f); p.lineTo(w / 2, h * 0.72f) }
                      "right" -> { p.moveTo(w * 0.8f, h / 2); p.lineTo(w * 0.2f, h / 2) }
                      else -> { p.moveTo(w * 0.2f, h / 2); p.lineTo(w * 0.8f, h / 2) }
                  }
                  val ok = gesture(p, 350L)
                  settle()
                  return if (ok) "Kaydırıldı: $dir" else "HATA: kaydırma başarısız."
              }

              fun press(key: String): String {
                  val act = when (key) {
                      "back" -> GLOBAL_ACTION_BACK
                      "home" -> GLOBAL_ACTION_HOME
                      "recents" -> GLOBAL_ACTION_RECENTS
                      "notifications" -> GLOBAL_ACTION_NOTIFICATIONS
                      "quick_settings" -> GLOBAL_ACTION_QUICK_SETTINGS
                      else -> return "HATA: bilinmeyen tuş: $key"
                  }
                  val ok = performGlobalAction(act)
                  settle()
                  return if (ok) "Tuşa basıldı: $key" else "HATA: tuş çalışmadı: $key"
              }

              // ---------- Ekran goruntusu ----------
              fun screenshot(): String {
                  if (Build.VERSION.SDK_INT < 30) return "HATA: ekran görüntüsü için Android 11 veya üstü gerekir."
                  for (attempt in 0 until 2) {
                      val latch = CountDownLatch(1)
                      val name = AtomicReference<String?>(null)
                      val err = AtomicReference<Int?>(null)
                      takeScreenshot(Display.DEFAULT_DISPLAY, exec, object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                              try {
                                  val hb = result.hardwareBuffer
                                  val bmp = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                  if (bmp != null) {
                                      val copy = bmp.copy(Bitmap.Config.ARGB_8888, false)
                                      if (copy != null) name.set(saveBitmap(copy))
                                  }
                                  hb.close()
                              } catch (e: Exception) {
                                  err.set(-1)
                              }
                              latch.countDown()
                          }

                          override fun onFailure(errorCode: Int) {
                              err.set(errorCode)
                              latch.countDown()
                          }
                      })
                      latch.await(6, TimeUnit.SECONDS)
                      val n = name.get()
                      if (n != null) return "Ekran görüntüsü kaydedildi: Resimler/Novax/$n"
                      if (err.get() == 3) {
                          Thread.sleep(1200)
                          continue
                      }
                      break
                  }
                  return "HATA: ekran görüntüsü alınamadı (güvenli ekran olabilir, örn. banka veya şifre ekranı)."
              }

              private fun saveBitmap(bmp: Bitmap): String? {
                  val name = "novax_" + SimpleDateFormat("yyyyMMdd_HHmmss", Engine.TR).format(Date()) + ".png"
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, "image/png")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Novax")
                  val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                  contentResolver.openOutputStream(uri)?.use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  return name
              }
          }
