              private fun intP(d: String) = JSONObject().put("type", "integer").put("description", d)
              private fun numP(d: String) = JSONObject().put("type", "number").put("description", d)
              private fun boolP(d: String) = JSONObject().put("type", "boolean").put("description", d)
              private fun enumP(d: String, vararg v: String) =
                  JSONObject().put("type", "string").put("description", d).put("enum", JSONArray(v.toList()))

              private fun tool(name: String, desc: String, props: JSONObject = JSONObject(), req: List<String> = emptyList()): JSONObject {
                  val params = JSONObject().put("type", "object").put("properties", props)
                  if (req.isNotEmpty()) params.put("required", JSONArray(req))
                  return JSONObject().put("type", "function").put(
                      "function", JSONObject().put("name", name).put("description", desc).put("parameters", params)
                  )
              }

