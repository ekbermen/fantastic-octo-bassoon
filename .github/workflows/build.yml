              // ---------- Metin esleme ----------
              fun norm(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s.lowercase(TR)) {
                      val c = when (ch) {
                          'ç' -> 'c'
                          'ğ' -> 'g'
                          'ı' -> 'i'
                          'ö' -> 'o'
                          'ş' -> 's'
                          'ü' -> 'u'
                          'â' -> 'a'
                          'î' -> 'i'
                          'û' -> 'u'
                          else -> ch
                      }
                      if (c.isLetterOrDigit()) sb.append(c)
                  }
                  return sb.toString()
              }

              private fun lev(a: String, b: String): Int {
                  if (a == b) return 0
                  val dp = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      var prev = dp[0]
                      dp[0] = i
                      for (j in 1..b.length) {
                          val tmp = dp[j]
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          dp[j] = minOf(dp[j] + 1, dp[j - 1] + 1, prev + cost)
                          prev = tmp
                      }
                  }
                  return dp[b.length]
              }

              fun textScore(term: String, label: String): Double {
                  if (term.isEmpty() || label.isEmpty()) return 0.0
                  if (term == label) return 1.0
                  if (term.length >= 3 && label.startsWith(term)) return 0.9
                  if (label.length >= 3 && term.startsWith(label)) return 0.88
                  if (term.length >= 3 && label.contains(term)) return 0.85
                  if (label.length >= 4 && term.contains(label)) return 0.8
                  val sim = 1.0 - lev(term, label).toDouble() / maxOf(term.length, label.length)
                  return if (sim >= 0.67) sim * 0.9 else 0.0
              }

              private val ALIASES: List<List<String>> = listOf(
                  listOf("not", "notlar", "notdefteri", "notes", "note", "notepad", "keep", "memo", "samsungnotes", "googlekeep"),
                  listOf("playstore", "googleplay", "playmagazasi", "market", "googleplaystore", "magaza"),
                  listOf("kamera", "camera", "fotografmakinesi"),
                  listOf("galeri", "gallery", "fotograflar", "photos", "resimler", "googlefotograflar"),
                  listOf("ayarlar", "settings", "ayar"),
                  listOf("telefon", "phone", "dialer", "arama"),
                  listOf("rehber", "kisiler", "contacts"),
                  listOf("mesajlar", "mesaj", "messages", "sms"),
                  listOf("hesapmakinesi", "calculator", "hesap"),
                  listOf("saat", "clock", "alarm", "alarmlar"),
                  listOf("takvim", "calendar"),
                  listOf("dosyalar", "files", "dosyayoneticisi", "myfiles", "dosyalarim"),
                  listOf("tarayici", "browser", "chrome", "internet", "googlechrome"),
                  listOf("harita", "haritalar", "maps", "googlemaps"),
                  listOf("youtube", "yt", "tube"),
                  listOf("gemini", "googlegemini"),
                  listOf("muzik", "music", "player")
              )

              private fun launcherApps(): List<Pair<String, String>> {
                  val pm = app.packageManager
                  val li = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  return li.map { Pair(it.loadLabel(pm).toString(), it.activityInfo.packageName) }.distinctBy { it.second }
              }

              fun resolveApp(raw: String): List<AppHit> {
                  var q = norm(raw)
                  for (suf in listOf("uygulamasini", "uygulamasi", "uygulama", "app")) {
                      if (q.length > suf.length + 1 && q.endsWith(suf)) {
                          q = q.removeSuffix(suf)
                          break
                      }
                  }
                  if (q.isEmpty()) return emptyList()
                  val terms = mutableSetOf(q)
                  for (g in ALIASES) if (g.contains(q)) terms.addAll(g)
                  val hits = ArrayList<AppHit>()
                  for ((label, pkg) in launcherApps()) {
                      val ln = norm(label)
                      val pn = norm(pkg)
                      var best = 0.0
                      for (t in terms) {
                          var s = textScore(t, ln)
                          if (t.length >= 4 && pn.contains(t) && s < 0.7) s = 0.7
                          if (s > best) best = s
                      }
                      if (best >= 0.6) hits.add(AppHit(label, pkg, best))
                  }
                  return hits.sortedWith(compareByDescending<AppHit> { it.score }.thenBy { it.label.length })
              }

              fun launch(i: Intent): Boolean {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val ctx: Context = NovaxAccess.inst ?: app
                  return try {
                      ctx.startActivity(i)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun waitForeground(pkg: String, ms: Long): Boolean {
                  val svc = NovaxAccess.inst
                  if (svc == null) {
                      Thread.sleep(1500)
                      return false
                  }
                  val end = System.currentTimeMillis() + ms
                  while (System.currentTimeMillis() < end) {
                      val cur = svc.rootInActiveWindow?.packageName?.toString()
                      if (cur == pkg) {
                          Thread.sleep(500)
                          return true
                      }
                      Thread.sleep(250)
                  }
                  return false
              }

              // ---------- AI ayarlari ----------
              fun isLocal() = p("provider", "groq") == "local"
              fun baseUrl() = if (isLocal()) p("local_url", "http://127.0.0.1:11434/v1").trimEnd('/') else GROQ
              fun apiKey() = if (isLocal()) p("local_key") else p("groq_key")

              private fun isChatModel(id: String): Boolean {
                  val l = id.lowercase()
                  return listOf("whisper", "guard", "tts", "orpheus", "playai", "embed", "safeguard").none { l.contains(it) }
              }

              private fun pickModel(ids: List<String>): String? {
                  val ok = ids.filter { isChatModel(it) && it !in bad }
                  return PREFERRED.firstOrNull { it in ok } ?: ok.firstOrNull()
              }

              fun groqModel(key: String): String {
                  val pref = p("model", "auto")
                  if (pref.isNotBlank() && pref != "auto" && pref !in bad) return pref
                  autoModel?.let { if (it !in bad) return it }
                  val m = pickModel(fetchModels(GROQ, key)) ?: FALLBACK_MODEL
                  autoModel = m
                  return m
              }

              fun modelName(): String =
                  if (isLocal()) "Yerel · " + p("local_model", "llama3.2")
                  else "Groq · " + (autoModel ?: p("model", "auto"))

              private fun isModelErr(e: ApiError): Boolean {
                  val m = (e.message ?: "").lowercase()
                  return e.errCode in listOf("model_not_found", "model_decommissioned", "model_terms_required") ||
                      e.code == 404 ||
                      (e.code in listOf(400, 403) && m.contains("model") && !m.contains("tool"))
              }

              private fun apiError(code: Int, text: String): ApiError {
                  var msg = "Sunucu hatası (HTTP $code)"
                  var ec = ""
                  try {
                      val er = JSONObject(text).opt("error")
                      if (er is JSONObject) {
                          msg = er.optString("message", msg)
                          ec = er.optString("code", "")
                      } else if (er is String && er.isNotBlank()) {
                          msg = er
                      }
                  } catch (e: Exception) {
                  }
                  return ApiError(code, msg, ec)
              }

              fun friendlyEx(e: Exception): String = when (e) {
                  is UnknownHostException -> "Sunucuya ulaşılamadı. İnternet bağlantını veya adresi kontrol et."
                  is ConnectException -> "Sunucuya bağlanılamadı. Adres doğru mu, sunucu çalışıyor mu?"
                  is SocketTimeoutException -> "Sunucu zaman aşımına uğradı."
                  is ApiError -> when {
                      e.code == 401 -> "API anahtarı geçersiz. Ayarlardan kontrol et."
                      e.code == 429 -> "İstek limiti doldu, biraz bekleyip tekrar dene."
                      else -> e.message ?: "Hata (HTTP ${e.code})"
                  }
                  else -> e.message ?: "Bilinmeyen hata"
              }

              fun fetchModels(base: String, key: String): List<String> {
                  val c = URL("$base/models").openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 15000
                  if (key.isNotBlank()) c.setRequestProperty("Authorization", "Bearer $key")
                  val code = c.responseCode
                  val text = (if (code in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                  c.disconnect()
                  if (code !in 200..299) throw apiError(code, text)
                  val arr = JSONObject(text).getJSONArray("data")
                  return (0 until arr.length()).map { arr.getJSONObject(it).getString("id") }
              }

              fun listModels() {
                  Thread {
                      try {
                          var ids = fetchModels(baseUrl(), apiKey())
                          if (!isLocal()) ids = ids.filter { isChatModel(it) }
                          emit("onModels(${JSONObject.quote(JSONArray(ids).toString())},\"\")")
                      } catch (e: Exception) {
                          emit("onModels(\"[]\",${JSONObject.quote(friendlyEx(e))})")
                      }
                  }.start()
              }

              private fun basePrompt(): String {
                  val persona = p("persona").ifBlank { DEFAULT_PERSONA }
                  val about = p("about")
                  val now = SimpleDateFormat("d MMMM yyyy EEEE HH:mm", TR).format(Date())
                  val en = if (p("lang", "tr-TR") == "en-US") " Kullanıcı İngilizce konuşuyor, İngilizce cevap ver." else ""
                  return persona + en + " Şu anki tarih ve saat: $now." +
                      (if (about.isNotBlank()) " Kullanıcı hakkında bilgi: $about." else "")
              }

              private fun chatPrompt() = basePrompt() + CAPS
              private fun agentPrompt() = basePrompt() + AGENT_RULES

              fun stopAll() {
                  for (t in tasks.values) {
                      t.cancelled = true
                      val c = t.conn
                      if (c != null) Thread { try { c.disconnect() } catch (e: Exception) {} }.start()
                  }
              }

              private fun finish(t: Task, ok: Boolean, out: String) {
                  tasks.remove(t.id)
                  emit("onChatResult(${t.id},$ok,${JSONObject.quote(out)})")
                  emitTasks()
                  if (!uiVisible && out.isNotBlank()) notifyResult(if (ok) "Novax" else "Novax hata", out)
              }

              // ---------- Duz sohbet (ajan kapaliyken, akisli) ----------
              fun startChat(id: Int, historyJson: String) {
                  val t = Task(id, "")
                  tasks[id] = t
                  emitTasks()
                  Thread {
                      var ok = true
                      var out = ""
                      try {
                          val local = isLocal()
                          val base = baseUrl()
                          val key = apiKey()
                          val hist = JSONArray(historyJson)
                          val msgs = JSONArray()
                          msgs.put(JSONObject().put("role", "system").put("content", chatPrompt()))
                          for (i in 0 until hist.length()) msgs.put(hist.getJSONObject(i))
                          var model = if (local) p("local_model", "llama3.2") else groqModel(key)
                          var tries = 0
                          while (true) {
                              try {
                                  out = streamChat(t, base, key, model, msgs)
                                  break
                              } catch (e: ApiError) {
                                  if (!local && tries < 3 && isModelErr(e)) {
                                      tries++
                                      bad.add(model)
                                      autoModel = null
                                      val next = groqModel(key)
                                      if (next == model) throw e
                                      model = next
                                      emit("onModelChanged(${JSONObject.quote(model)})")
                                  } else {
                                      throw e
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          ok = false
                          out = friendlyEx(e)
                      }
                      finish(t, ok, out)
                  }.start()
              }

              private fun streamChat(t: Task, base: String, key: String, model: String, messages: JSONArray): String {
                  val c = URL("$base/chat/completions").openConnection() as HttpURLConnection
                  t.conn = c
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 90000
                  if (key.isNotBlank()) c.setRequestProperty("Authorization", "Bearer $key")
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("Accept", "text/event-stream")
                  c.doOutput = true
                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", messages)
                      .put("temperature", (p("temp", "0.7").toDoubleOrNull() ?: 0.7))
                      .put("max_tokens", 1500)
                      .put("stream", true)
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  if (code !in 200..299) {
                      val text = c.errorStream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      c.disconnect()
                      throw apiError(code, text)
                  }
                  val sb = StringBuilder()
                  try {
                      c.inputStream.bufferedReader(Charsets.UTF_8).use { r ->
                          while (!t.cancelled) {
                              val line = r.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val d = line.substring(5).trim()
                              if (d == "[DONE]") break
                              if (d.isEmpty()) continue
                              try {
                                  val delta = JSONObject(d).getJSONArray("choices").optJSONObject(0)?.optJSONObject("delta")
                                  if (delta != null && !delta.isNull("content")) {
                                      val piece = delta.getString("content")
                                      if (piece.isNotEmpty()) {
                                          sb.append(piece)
                                          emit("onToken(${t.id},${JSONObject.quote(piece)})")
                                      }
                                  }
                              } catch (e: Exception) {
                              }
                          }
                      }
                  } catch (e: java.io.IOException) {
                      if (!t.cancelled && sb.isEmpty()) throw e
                  } finally {
                      val cc = c
                      Thread { try { cc.disconnect() } catch (e: Exception) {} }.start()
                  }
                  return sb.toString()
              }

              // ---------- Ajan ----------
              fun startAgent(id: Int, historyJson: String) {
                  val t = Task(id, "")
                  tasks[id] = t
                  emitTasks()
                  Thread { runAgent(t, historyJson) }.start()
              }

              fun runBackground(text: String) {
                  Thread {
                      try {
                          val id = bgId.incrementAndGet()
                          emit("onExternalUser(${JSONObject.quote(text)})")
                          val quick = runCommand(text)
                          if (quick.isNotEmpty()) {
                              emit("onChatResult($id,true,${JSONObject.quote(quick)})")
                              if (!uiVisible) notifyResult("Novax", quick)
                              return@Thread
                          }
                          val h = JSONArray().put(JSONObject().put("role", "user").put("content", text))
                          if (p("agent", "1") == "1") startAgent(id, h.toString()) else startChat(id, h.toString())
                      } catch (e: Exception) {
                      }
                  }.start()
              }

              private fun sleepCancelable(t: Task, ms: Long) {
                  val end = System.currentTimeMillis() + ms
                  while (System.currentTimeMillis() < end && !t.cancelled) Thread.sleep(200)
              }

              private fun pruneOld(msgs: JSONArray) {
                  val idx = ArrayList<Int>()
                  for (i in 0 until msgs.length()) {
                      val m = msgs.optJSONObject(i) ?: continue
                      if (m.optString("role") == "tool" && m.optString("content").length > 400) idx.add(i)
                  }
                  if (idx.size <= 2) return
                  for (k in 0 until idx.size - 2) {
                      val i = idx[k]
                      val m = msgs.getJSONObject(i)
                      val old = m.optString("content")
                      m.put("content", old.take(200) + " ...(eski çıktı kısaltıldı)")
                  }
              }

              private fun runAgent(t: Task, historyJson: String) {
                  var ok = true
                  var out = ""
                  try {
                      val local = isLocal()
                      val base = baseUrl()
                      val key = apiKey()
                      val hist = JSONArray(historyJson)
                      val msgs = JSONArray()
                      msgs.put(JSONObject().put("role", "system").put("content", agentPrompt()))
                      for (i in 0 until hist.length()) msgs.put(hist.getJSONObject(i))
                      var model = if (local) p("local_model", "llama3.2") else groqModel(key)
                      var steps = 0
                      var toolFail = 0
                      var modelTries = 0
                      var rate = 0
                      var noTools = false
                      var usedTools = false
                      while (true) {
                          if (t.cancelled) {
                              out = "Görev durduruldu."
                              break
                          }
                          if (steps++ >= 30) {
                              out = "Çok fazla adım attım ve durdum. Şu ana kadar yaptıklarım adımlar listesinde. İstersen devam etmemi söyle."
                              break
                          }
                          pruneOld(msgs)
                          val msg = try {
                              chatOnce(t, base, key, model, msgs, !noTools)
                          } catch (e: ApiError) {
                              if (t.cancelled) continue
                              if (!local && modelTries < 3 && isModelErr(e)) {
                                  modelTries++
                                  bad.add(model)
                                  autoModel = null
                                  val next = groqModel(key)
                                  if (next == model) throw e
                                  model = next
                                  emit("onModelChanged(${JSONObject.quote(model)})")
                                  continue
                              }
                              if (e.errCode == "tool_use_failed" && toolFail < 3) {
                                  toolFail++
                                  continue
                              }
                              if (e.code == 429 && rate < 4) {
                                  rate++
                                  step(t, "İstek limiti doldu, 7 sn bekliyorum")
                                  sleepCancelable(t, 7000)
                                  continue
                              }
                              if (e.code == 400 && !noTools && (e.message ?: "").lowercase().contains("tool")) {
                                  noTools = true
                                  step(t, "Bu model araç kullanmayı desteklemiyor, sadece sohbet ediyorum")
                                  continue
                              }
                              throw e
                          }
                          val content = if (msg.isNull("content")) "" else msg.optString("content", "")
                          val calls = msg.optJSONArray("tool_calls")
                          if (calls == null || calls.length() == 0) {
                              out = content.replace(Regex("<think>[\\s\\S]*?(</think>|$)"), "").trim()
                              if (out.isEmpty()) out = if (usedTools) "Tamamlandı." else "Anlayamadım, tekrar söyler misin?"
                              break
                          }
                          usedTools = true
                          val am = JSONObject().put("role", "assistant")
                              .put("content", if (content.isBlank()) JSONObject.NULL else content)
                              .put("tool_calls", calls)
                          msgs.put(am)
                          for (i in 0 until calls.length()) {
                              val c = calls.getJSONObject(i)
                              val fn = c.getJSONObject("function")
                              val name = fn.getString("name")
                              val argStr = fn.optString("arguments", "{}")
                              val args = try {
                                  JSONObject(if (argStr.isBlank()) "{}" else argStr)
                              } catch (e: Exception) {
                                  JSONObject()
                              }
                              step(t, describe(name, args))
                              val res = try {
                                  runTool(t, name, args)
                              } catch (e: Exception) {
                                  "HATA: " + (e.message ?: e.javaClass.simpleName)
                              }
                              msgs.put(
                                  JSONObject().put("role", "tool").put("tool_call_id", c.getString("id"))
                                      .put("content", res.take(5000))
                              )
                              if (t.cancelled) break
                          }
                      }
                  } catch (e: Exception) {
                      ok = false
                      out = friendlyEx(e)
                  } finally {
                      if (t.hasUi) {
                          try { uiLock.unlock() } catch (e: Exception) {}
                          t.hasUi = false
                      }
                  }
                  finish(t, ok, out)
              }

              private fun chatOnce(t: Task, base: String, key: String, model: String, messages: JSONArray, withTools: Boolean): JSONObject {
                  val c = URL("$base/chat/completions").openConnection() as HttpURLConnection
                  t.conn = c
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 90000
                  if (key.isNotBlank()) c.setRequestProperty("Authorization", "Bearer $key")
                  c.setRequestProperty("Content-Type", "application/json")
                  c.doOutput = true
                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", messages)
                      .put("temperature", 0.3)
                      .put("max_tokens", 2048)
                  if (withTools) {
                      body.put("tools", TOOLS)
                      body.put("tool_choice", "auto")
                  }
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  val text = (if (code in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                  c.disconnect()
                  if (code !in 200..299) throw apiError(code, text)
                  return JSONObject(text).getJSONArray("choices").getJSONObject(0).getJSONObject("message")
              }

